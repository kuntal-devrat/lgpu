[package]
name = "lgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Lightweight, bindless-first Vulkan 1.3 wrapper for Rust"

[features]
default = ["vulkan"]
vulkan = ["lgpu-hal/vulkan"]
wgsl = ["dep:naga"]

[dependencies]
lgpu-hal = { path = "../lgpu-hal", version = "0.1.4", default-features = false }
bytemuck = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
raw-window-handle = { workspace = true }
naga = { version = "25.0", optional = true, features = ["wgsl-in", "spv-out"] }
