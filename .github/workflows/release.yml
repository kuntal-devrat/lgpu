name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish to crates.io)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-tools \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            pkg-config

      - name: Configure Vulkan ICD (Lavapipe)
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> $GITHUB_ENV
          elif [ -f /usr/share/vulkan/icd.d/lvp_icd.json ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> $GITHUB_ENV
          fi

      - name: Check Formatting & Lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Test Suite
        run: cargo test --workspace --all-targets --verbose

  publish-crates:
    name: Publish to Crates.io
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev pkg-config

      - name: Publish lgpu-hal
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          EXTRA_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAG="--dry-run"
          fi
          echo "Publishing lgpu-hal..."
          cargo publish -p lgpu-hal $EXTRA_FLAG

      - name: Wait for crates.io index propagation (lgpu-hal)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Waiting 30 seconds for lgpu-hal to register on crates.io..."
          sleep 30

      - name: Publish lgpu
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          EXTRA_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAG="--dry-run"
          fi
          echo "Publishing lgpu..."
          cargo publish -p lgpu $EXTRA_FLAG

      - name: Wait for crates.io index propagation (lgpu)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Waiting 30 seconds for lgpu to register on crates.io..."
          sleep 30

      - name: Publish lgpu-c
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          EXTRA_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAG="--dry-run"
          fi
          echo "Publishing lgpu-c..."
          cargo publish -p lgpu-c $EXTRA_FLAG

  create-github-release:
    name: Create GitHub Release
    needs: [publish-crates]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          files: |
            crates/lgpu-c/include/lgpu.h
            assets/logo_banner.png
            assets/demo.gif
