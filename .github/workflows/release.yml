name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (simulate publishing without uploading to crates.io)"
        required: false
        default: false
        type: boolean
      publish_crates:
        description: "Publish crates to crates.io"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-tools \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            pkg-config

      - name: Configure Vulkan ICD (Lavapipe)
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> $GITHUB_ENV
          elif [ -f /usr/share/vulkan/icd.d/lvp_icd.json ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> $GITHUB_ENV
          fi

      - name: Check Formatting & Lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Test Suite
        run: cargo test --workspace --all-targets --verbose

  publish-crates:
    name: Publish to Crates.io
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.event.inputs.publish_crates != false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev pkg-config jq curl

      - name: Publish Crates with Pre-flight Check
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_crate() {
            local pkg=$1
            local version
            version=$(cargo metadata --format-version 1 --no-deps | jq -r ".packages[] | select(.name==\"$pkg\") | .version")
            echo "------------------------------------------------------------"
            echo "Evaluating package: $pkg v$version"
            echo "------------------------------------------------------------"

            local http_status
            http_status=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: lgpu-release-bot" "https://crates.io/api/v1/crates/$pkg/$version" || echo "000")

            if [ "$http_status" = "200" ]; then
              echo "Notice: $pkg v$version is already published on crates.io. Skipping publish."
            else
              local extra_flag=""
              if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
                extra_flag="--dry-run"
                echo "Dry-run enabled: Simulating publication of $pkg v$version..."
              else
                echo "Publishing $pkg v$version to crates.io..."
              fi

              cargo publish -p "$pkg" $extra_flag

              if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
                echo "Waiting 30 seconds for crates.io index propagation..."
                sleep 30
              fi
            fi
          }

          echo "Beginning publish sequence in dependency order..."
          publish_crate "lgpu-hal"
          publish_crate "lgpu"
          publish_crate "lgpu-c"

  create-github-release:
    name: Create GitHub Release
    needs: [verify, publish-crates]
    if: always() && needs.verify.result == 'success' && (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          files: |
            crates/lgpu-c/include/lgpu.h
            assets/logo_banner.png
            assets/demo.gif
